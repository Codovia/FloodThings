# FloodPulse on one server: PostGIS database, FastAPI app (serves the site too) and Caddy (HTTPS).
# Settings and secrets come from deploy/.env (private, 0600, never committed). See docs/AZURE_HOSTING.md.
name: floodpulse

# Docker logs are capped so they cannot fill the disk (3 files x 10 MB per service).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: floodpulse_directory
      POSTGRES_USER: floodpulse_admin
      POSTGRES_PASSWORD: ${MAINTENANCE_PASSWORD:?run deploy/setup.sh first}
      READER_PASSWORD: ${READER_PASSWORD:?run deploy/setup.sh first}
      APP_PASSWORD: ${APP_PASSWORD:?run deploy/setup.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init/20-floodpulse-roles.sh:/docker-entrypoint-initdb.d/20-floodpulse-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodpulse_admin -d floodpulse_directory"]
      interval: 5s
      timeout: 5s
      retries: 30
    # No published port: the database is reachable only from the app container.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: floodpulse-app
    restart: unless-stopped
    logging: *logging
    # Trust X-Forwarded-For only from Caddy's fixed address, so rate limits see each visitor's real
    # address. Caddy replaces any X-Forwarded-For a client sends, so it cannot be spoofed.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1",
              "--proxy-headers", "--forwarded-allow-ips", "172.28.0.10"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Restricted roles only; the maintenance (owner) login never reaches the running app.
      DATABASE_URL: postgresql+psycopg://floodpulse_location_reader:${READER_PASSWORD}@db:5432/floodpulse_directory
      SHELTER_DATABASE_URL: postgresql+psycopg://floodpulse_shelter_app:${APP_PASSWORD}@db:5432/floodpulse_directory
      LOCATION_DIRECTORY_BACKEND: postgres
      SHELTER_PUBLIC_ORIGIN: ${FLOODPULSE_ORIGIN:?set FLOODPULSE_ORIGIN in deploy/.env}
      SHELTER_COOKIE_SECURE: "true"
      SHELTER_DIRECTORY_MODE: live
      # Optional limits (requests/seconds, or per 15 minutes for login and reports); defaults shown.
      FLOODPULSE_RATE_PUBLIC: ${FLOODPULSE_RATE_PUBLIC:-300/60}
      FLOODPULSE_RATE_EXPENSIVE: ${FLOODPULSE_RATE_EXPENSIVE:-30/60}
      FLOODPULSE_ROUTE_DAILY_LIMIT: ${FLOODPULSE_ROUTE_DAILY_LIMIT:-1500}
      FLOODPULSE_LOGIN_LIMIT_PER_ACCOUNT: ${FLOODPULSE_LOGIN_LIMIT_PER_ACCOUNT:-5}
      FLOODPULSE_LOGIN_LIMIT_PER_ADDRESS: ${FLOODPULSE_LOGIN_LIMIT_PER_ADDRESS:-20}
      FLOODPULSE_REPORT_LIMIT_PER_ADDRESS: ${FLOODPULSE_REPORT_LIMIT_PER_ADDRESS:-5}
      FLOODPULSE_REPORT_LIMIT_TOTAL: ${FLOODPULSE_REPORT_LIMIT_TOTAL:-60}
      GOOGLE_MAPS_EMBED_API_KEY: ${GOOGLE_MAPS_EMBED_API_KEY:-}
      MAPTILER_PUBLIC_KEY: ${MAPTILER_PUBLIC_KEY:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DESTINATIONS: ${TELEGRAM_DESTINATIONS:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - risk-cache:/cache

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.28.0.10
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      FLOODPULSE_DOMAIN: ${FLOODPULSE_DOMAIN:?set FLOODPULSE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db-data:
  risk-cache:
  caddy-data:
  caddy-config:
