# FloodPulse on one server: PostGIS database, FastAPI app (serves the site too) and Caddy (HTTPS).
# Settings and secrets come from deploy/.env (private, 0600, never committed). See docs/AZURE_HOSTING.md.
name: floodpulse

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: floodpulse_directory
      POSTGRES_USER: floodpulse_admin
      POSTGRES_PASSWORD: ${MAINTENANCE_PASSWORD:?run deploy/setup.sh first}
      READER_PASSWORD: ${READER_PASSWORD:?run deploy/setup.sh first}
      APP_PASSWORD: ${APP_PASSWORD:?run deploy/setup.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init/20-floodpulse-roles.sh:/docker-entrypoint-initdb.d/20-floodpulse-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodpulse_admin -d floodpulse_directory"]
      interval: 5s
      timeout: 5s
      retries: 30
    # No published port: the database is reachable only from the app container.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: floodpulse-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Restricted roles only; the maintenance (owner) login never reaches the running app.
      DATABASE_URL: postgresql+psycopg://floodpulse_location_reader:${READER_PASSWORD}@db:5432/floodpulse_directory
      SHELTER_DATABASE_URL: postgresql+psycopg://floodpulse_shelter_app:${APP_PASSWORD}@db:5432/floodpulse_directory
      LOCATION_DIRECTORY_BACKEND: postgres
      SHELTER_PUBLIC_ORIGIN: ${FLOODPULSE_ORIGIN:?set FLOODPULSE_ORIGIN in deploy/.env}
      SHELTER_COOKIE_SECURE: "true"
      SHELTER_DIRECTORY_MODE: live
      GOOGLE_MAPS_EMBED_API_KEY: ${GOOGLE_MAPS_EMBED_API_KEY:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DESTINATIONS: ${TELEGRAM_DESTINATIONS:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - risk-cache:/cache

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      FLOODPULSE_DOMAIN: ${FLOODPULSE_DOMAIN:?set FLOODPULSE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  risk-cache:
  caddy-data:
  caddy-config:
